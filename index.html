<!DOCTYPE html>
<html lang="es">
<head>
<style>html.visita button[onclick*="formService"],html.visita button[onclick*="formSalida"],html.visita button[onclick*="formRegreso"],html.visita button[onclick*="fichaUnidad"],html.visita button[onclick*="adjuntar"],html.visita button[onclick*="formFalla"],html.visita button[onclick*="formMant"],html.visita button[onclick*="formMov"],html.visita button[onclick*="formIngreso"],html.visita button[onclick*="formSalidaTaller"],html.visita button[onclick*="formTaller"]{display:none!important}</style>
<script>
/* Fuera de Google: imita google.script.run llamando al servidor por internet, con clave de acceso. */
(function(){
  const API_URL = "https://script.google.com/macros/s/AKfycbyVFFew5nqJpQBBPSlDmhrLWXhTAfkX4UgU_b8x2mNekQOgfoNspHLJNv62zkTvMayy/exec";
  function clave(forzar){
    let k = null; try { k = localStorage.getItem('tablero_clave'); } catch(e){}
    if (!k || forzar){ k = prompt('Clave de acceso al tablero:') || ''; try { localStorage.setItem('tablero_clave', k); } catch(e){} }
    return k;
  }
  function llamar(fn, args){
    const req = { fn, args, clave: clave(false) };
    return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(req), credentials:'omit', redirect:'follow' })
      .then(r => { if (!r.ok) throw new Error('El servidor respondió ' + r.status); return r.json(); })
      .then(r => { if (r.ok) { if (r.rol === 'visita') document.documentElement.classList.add('visita'); return r.data; } if (r.auth){ try{localStorage.removeItem('tablero_clave')}catch(e){} } throw new Error(r.error || 'Error desconocido'); });
  }
  function nuevo(ok, fail){
    return new Proxy({}, { get(_, nombre){
      if (nombre === 'withSuccessHandler') return f => nuevo(f, fail);
      if (nombre === 'withFailureHandler') return f => nuevo(ok, f);
      return (...args) => { llamar(nombre, args).then(r => ok && ok(r), e => (fail || (x => alert(x.message)))(e)); };
    }});
  }
  window.google = { script: { run: nuevo(null, null) } };
})();
</script>

<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#1c2733;--mut:#6b7a8c;--az:#1f3a5f;--ok:#2e8b57;--wa:#e3a008;--er:#c0392b;--bd:#dfe4ea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:var(--bg);color:var(--tx)}
header{background:var(--az);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:18px;margin:0}header small{opacity:.8}
nav{display:flex;gap:4px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--bd);overflow-x:auto}
nav button{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;color:var(--mut)}
nav button.on{background:var(--az);color:#fff}
main{padding:16px;max-width:1300px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.kpi b{font-size:26px;display:block}.kpi span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;border-left:5px solid var(--ok)}
.card.ALERTA{border-left-color:var(--wa)}.card.VENCIDO,.card.FUERA{border-left-color:var(--er)}
.card h3{margin:0 0 4px;font-size:16px}.card p{margin:2px 0;font-size:13px;color:var(--mut)}
.bar{height:8px;background:#e7ebf0;border-radius:4px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.ALERTA .bar i{background:var(--wa)}.VENCIDO .bar i{background:var(--er)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;color:#fff;background:var(--mut)}
.tag.CRITICA,.tag.VENCIDO,.tag.FUERA{background:var(--er)}.tag.ALTA,.tag.ALERTA,.tag.OBS{background:var(--wa)}.tag.OK,.tag.OPERATIVO,.tag.RESUELTA,.tag.COMPLETADO{background:var(--ok)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}th{background:#eaeef3}
.wrap{overflow-x:auto}
button.b{background:var(--az);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}button.b.s{background:#fff;color:var(--az);border:1px solid var(--az)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
input,select,textarea{padding:7px;border:1px solid var(--bd);border-radius:6px;font:inherit;width:100%}
dialog{border:0;border-radius:12px;padding:18px;max-width:520px;width:94%}dialog::backdrop{background:#0006}
.f{margin-bottom:10px}.f label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a{color:var(--az)}
</style>

<body>
<header><h1>🚙⚓ Tablero de Móviles y Embarcaciones</h1><small id="upd">Cargando…</small></header>
<nav id="nav"></nav>
<main id="main"></main>
<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>

<script>
const TABS=[['bas','Móviles en base'],['res','Resumen'],['mov','Móviles'],['emb','Embarcaciones'],['rep','Reparaciones'],['man','Mantenimientos'],['des','Movimientos'],['ano','Inconsistencias'],['ale','Alertas']];
let D=null,tab='bas';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtF=s=>s?new Date(s).toLocaleDateString('es-AR'):'';
const nm=u=>u?u.identificador+' · '+u.marca_modelo:'(s/d)';
const U=id=>D.unidades.find(u=>u.id===id);
const prioOrd={CRITICA:0,ALTA:1,MEDIA:2,BAJA:3};

function cargar(){google.script.run.withSuccessHandler(d=>{D=d;$('#upd').textContent='Actualizado '+new Date(d.actualizado).toLocaleString('es-AR');pintar()}).withFailureHandler(e=>alert(e.message)).apiDatos()}
function pintarNav(){$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';pintar()">${t[1]}</button>`).join('')}
function pintar(){pintarNav();if(!D)return;const f={bas,res,mov:()=>flota('MOVIL'),emb:()=>flota('EMBARCACION'),rep,man,des,ano,ale}[tab];$('#main').innerHTML=f()}

function unit(u){return u.nivel_service||'OK'}
function card(u){
  const un=u.tipo==='MOVIL'?'km':'hs',pct=Math.min(100,Math.max(0,u.recorrido_desde_service/u.intervalo_efectivo*100));
  const fuera=u.condicion==='FUERA DE SERVICIO',cls=fuera?'FUERA':u.nivel_service;
  const fallas=D.fallas.filter(f=>f.unidad_id===u.id&&f.estado!=='RESUELTA').length;
  const adj=D.adjuntos.filter(a=>a.unidad_id===u.id).length;
  return `<div class="card ${cls}"><h3>${esc(u.identificador)} <span class="tag ${fuera?'FUERA':u.condicion==='CON OBSERVACIONES'?'OBS':'OK'}">${esc(u.condicion||'OPERATIVO')}</span></h3>
  <p>${esc(u.marca_modelo)} ${esc(u.anio)}</p><p>📍 Asignado a: <b>${esc(u.asignado_a||'sin asignar')}</b>${u.tipo==='MOVIL'?' · 🏠 Base: <b>'+esc(u.base||'sin asignar')+'</b>':''}</p>
  <p>Medidor: <b>${u.medidor_actual||0} ${un}</b> · Último service: ${u.medidor_ultimo_service||0} ${un}</p>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <p><span class="tag ${u.nivel_service}">${u.nivel_service}</span> Próximo service en <b>${u.falta} ${un}</b></p>
  <p>🔧 Fallas abiertas: ${fallas} · 📎 Adjuntos: ${adj}${D.anomalias.some(a=>a.unidad_id===u.id)?' · <b style="color:var(--er)">⚠ '+D.anomalias.filter(a=>a.unidad_id===u.id).length+' inconsistencias</b>':''}</p>
  <div class="tools" style="margin:8px 0 0"><button class="b" onclick="verFicha('${u.id}')">Ficha</button><button class="b s" onclick="formService('${u.id}')">Cargar service</button><button class="b s" onclick="fichaUnidad('${u.id}')">Editar</button><button class="b s" onclick="adjuntar('${u.id}')">📎 Adjuntar</button><button class="b s" onclick="verAdj('${u.id}')">Ver archivos</button></div></div>`}

function res(){
  const us=D.unidades.filter(u=>u.activo!=='NO');
  const al=us.filter(u=>u.nivel_service!=='OK'),fu=us.filter(u=>u.condicion==='FUERA DE SERVICIO');
  const ab=D.fallas.filter(f=>f.estado!=='RESUELTA'),cr=ab.filter(f=>f.prioridad==='CRITICA'||f.prioridad==='ALTA');
  return `<div class="kpis">
  <div class="kpi"><b>${us.filter(u=>u.tipo==='MOVIL').length}</b><span>Móviles</span></div>
  <div class="kpi"><b>${us.filter(u=>u.tipo!=='MOVIL').length}</b><span>Embarcaciones</span></div>
  <div class="kpi"><b style="color:var(--wa)">${al.length}</b><span>Service próximo / vencido</span></div>
  <div class="kpi"><b style="color:var(--er)">${fu.length}</b><span>Fuera de servicio</span></div>
  <div class="kpi"><b>${ab.length}</b><span>Fallas abiertas</span></div>
  <div class="kpi"><b style="color:var(--er)">${cr.length}</b><span>Crítica / alta</span></div></div>
  <h2>Requieren atención</h2><div class="grid">${al.concat(fu.filter(u=>!al.includes(u))).map(card).join('')||'<p>Todo en orden ✅</p>'}</div>`}

function flota(t){
  const us=D.unidades.filter(u=>u.tipo===t&&u.activo!=='NO');
  return `<div class="tools"><button class="b" onclick="fichaUnidad('',{tipo:'${t}'})">+ Nueva ${t==='MOVIL'?'unidad':'embarcación'}</button>
  <input id="q" placeholder="Buscar…" style="max-width:240px" oninput="filtrar(this.value)"></div><div class="grid" id="g">${us.map(card).join('')}</div>`}
function filtrar(v){v=v.toLowerCase();document.querySelectorAll('#g .card').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(v)?'':'none')}

function TL(id){return (D.talleres||[]).find(t=>t.id===id)}
function rep(){
  const adm=!document.documentElement.classList.contains('visita');
  const ord=f=>f.orden===''||f.orden==null?9999:Number(f.orden);
  const cola=D.fallas.filter(f=>f.estado==='ABIERTA').sort((a,b)=>ord(a)-ord(b)||(prioOrd[a.prioridad]??9)-(prioOrd[b.prioridad]??9));
  const enT=(D.visitas||[]).filter(v=>v.estado==='EN TALLER');
  const fin=(D.visitas||[]).filter(v=>v.estado==='FINALIZADA').sort((a,b)=>String(b.fecha_salida).localeCompare(String(a.fecha_salida)));
  const nf=v=>String(v.fallas_ids).split(',').map(id=>{const f=D.fallas.find(x=>x.id===id);return f?esc(f.descripcion):''}).filter(Boolean).join('; ');
  const tal=D.talleres||[];
  return `<h2>Lista de ingreso al taller (${cola.length})</h2><p style="color:var(--mut);font-size:13px">${adm?'Arrastrá las filas con ☰ para cambiar el orden: la de arriba entra primero.':'Orden de ingreso al taller.'}</p>
  <div class="tools"><button class="b" onclick="formFalla()">+ Registrar falla</button></div>
  <div class="wrap"><table id="cola"><tr><th></th><th>#</th><th>Unidad</th><th>Falla</th><th>Prioridad</th><th>Desde</th><th></th></tr>
  ${cola.map((f,i)=>`<tr data-id="${f.id}" ${adm?'draggable="true" ondragstart="dgS(event)" ondragover="dgO(event)" ondrop="dgD(event)" ondragend="dgE()"':''}><td style="cursor:${adm?'grab':'default'}">${adm?'☰':''}</td><td>${i+1}</td><td>${esc(nm(U(f.unidad_id)))}</td><td>${esc(f.descripcion)}</td><td><span class="tag ${f.prioridad}">${esc(f.prioridad)}</span></td><td>${fmtF(f.fecha)}</td><td><button class="b" onclick="formIngreso('${f.id}')">Ingresar a taller</button> <button class="b s" onclick="formFalla('${f.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan=7>Sin fallas esperando ✅</td></tr>'}</table></div>
  <h2>En el taller ahora (${enT.length})</h2><div class="wrap"><table><tr><th>Unidad</th><th>Taller</th><th>Ingresó</th><th>Fallas</th><th></th></tr>
  ${enT.map(v=>`<tr><td>${esc(nm(U(v.unidad_id)))}</td><td>${esc((TL(v.taller_id)||{}).nombre||'')}</td><td>${fmtF(v.fecha_ingreso)}</td><td>${nf(v)}</td><td><button class="b" onclick="formSalidaTaller('${v.id}')">Registrar salida</button></td></tr>`).join('')||'<tr><td colspan=5>Ningún vehículo en taller</td></tr>'}</table></div>
  <h2>Talleres mecánicos (${tal.length})</h2><div class="tools"><button class="b" onclick="formTaller()">+ Agregar taller</button></div>
  <div class="wrap"><table><tr><th>Taller</th><th>Dirección</th><th>Teléfono</th><th>Contacto</th><th>Vehículos arreglados</th><th></th></tr>
  ${tal.map(t=>{const vs=fin.filter(v=>v.taller_id===t.id);return `<tr><td><b>${esc(t.nombre)}</b></td><td>${esc(t.direccion)}</td><td>${esc(t.telefono)}</td><td>${esc(t.contacto)}</td><td>${vs.length}</td><td><button class="b s" onclick="formTaller('${t.id}')">Editar</button></td></tr>`}).join('')||'<tr><td colspan=6>Todavía no hay talleres cargados</td></tr>'}</table></div>
  <h2>Registro de arreglos: qué vehículo se arregló dónde</h2>
  <div class="tools"><input placeholder="Buscar por vehículo o taller…" style="max-width:280px" oninput="filtrarH(this.value)"></div>
  <div class="wrap"><table id="hist"><tr><th>Ingreso</th><th>Salida</th><th>Unidad</th><th>Taller</th><th>Trabajo</th><th>Costo</th><th>Factura</th></tr>
  ${fin.map(v=>`<tr><td>${fmtF(v.fecha_ingreso)}</td><td>${fmtF(v.fecha_salida)}</td><td>${esc(nm(U(v.unidad_id)))}</td><td>${esc((TL(v.taller_id)||{}).nombre||'')}</td><td>${esc(v.trabajo)||nf(v)}</td><td>${esc(v.costo)}</td><td>${esc(v.factura)}</td></tr>`).join('')||'<tr><td colspan=7>Sin arreglos registrados</td></tr>'}</table></div>`}
function filtrarH(v){v=v.toLowerCase();document.querySelectorAll('#hist tr').forEach((r,i)=>{if(i)r.style.display=r.textContent.toLowerCase().includes(v)?'':'none'})}
let dgFila=null;
function dgS(e){dgFila=e.currentTarget;e.dataTransfer.effectAllowed='move';e.currentTarget.style.opacity='.4'}
function dgO(e){e.preventDefault();const t=e.currentTarget;if(!dgFila||t===dgFila)return;const r=t.getBoundingClientRect();t.parentNode.insertBefore(dgFila,e.clientY>r.top+r.height/2?t.nextSibling:t)}
function dgD(e){e.preventDefault()}
function dgE(){if(!dgFila)return;dgFila.style.opacity='';dgFila=null;
  const ids=[...document.querySelectorAll('#cola tr[data-id]')].map(r=>r.dataset.id);
  document.querySelectorAll('#cola tr[data-id]').forEach((r,i)=>r.children[1].textContent=i+1);
  ids.forEach((id,i)=>{const f=D.fallas.find(x=>x.id===id);if(f)f.orden=i+1});
  google.script.run.withFailureHandler(e=>{alert(e.message);cargar()}).apiGuardarOrden(ids)}
function formTaller(id){const t=id?TL(id):{};abrir(id?'Editar taller':'Nuevo taller mecánico',campo('nombre','Nombre del taller',t.nombre)+campo('direccion','Dirección',t.direccion)+`<div class="row2">${campo('telefono','Teléfono',t.telefono)}${campo('contacto','Contacto',t.contacto)}</div>`+campo('notas','Notas',t.notas,'area'),o=>{if(id)o.id=id;guardar('apiGuardarTaller',o)})}
function formIngreso(fid){
  const f=D.fallas.find(x=>x.id===fid);
  if(!(D.talleres||[]).length){alert('Primero agregá un taller con "+ Agregar taller".');return}
  const otras=D.fallas.filter(x=>x.unidad_id===f.unidad_id&&x.estado==='ABIERTA');
  abrir('Ingresar a taller — '+esc(nm(U(f.unidad_id))),
  `<input type="hidden" name="unidad_id" value="${f.unidad_id}"><div class="f"><label>Taller</label><select name="taller_id">${D.talleres.map(t=>`<option value="${t.id}">${esc(t.nombre)}</option>`).join('')}</select></div>`+campo('fecha_ingreso','Fecha de ingreso',new Date().toISOString().slice(0,10),'date')+
  `<div class="f"><label>Fallas que se arreglan en esta visita</label>${otras.map(x=>`<p style="margin:3px 0"><label><input type="checkbox" name="f_${x.id}" ${x.id===fid?'checked':''}> ${esc(x.descripcion)}</label></p>`).join('')}</div>`,
  o=>{o.fallas_ids=Object.keys(o).filter(k=>k.startsWith('f_')).map(k=>k.slice(2)).join(',');guardar('apiIngresarTaller',o)})}
function formSalidaTaller(vid){
  const v=D.visitas.find(x=>x.id===vid);
  abrir('Salida del taller — '+esc(nm(U(v.unidad_id))),
  `<input type="hidden" name="id" value="${vid}">`+campo('fecha_salida','Fecha de salida',new Date().toISOString().slice(0,10),'date')+campo('trabajo','Trabajo realizado','','area')+`<div class="row2">${campo('costo','Costo','','number')}${campo('factura','N° de factura / remito')}</div>`,
  o=>guardar('apiSalidaTaller',o))}

function man(){
  return `<div class="tools"><button class="b" onclick="formMant()">+ Registrar mantenimiento / service</button></div><div class="wrap"><table><tr><th>Fecha</th><th>Unidad</th><th>Tipo</th><th>Categoría</th><th>Medidor</th><th>Detalle</th><th>Técnico</th><th>Estado</th><th>Origen</th></tr>
  ${D.mantenimientos.map(m=>`<tr><td>${fmtF(m.fecha)}</td><td>${esc(nm(U(m.unidad_id)))}</td><td>${esc(m.tipo)}</td><td>${esc(m.categoria)}</td><td>${esc(m.medidor)}</td><td>${esc(m.descripcion)}</td><td>${esc(m.tecnico)}</td><td><span class="tag ${m.estado}">${esc(m.estado)}</span></td><td>${esc(m.fuente)}</td></tr>`).join('')}</table></div>`}

function des(){
  return `<div class="tools"><button class="b" onclick="formMov()">+ Registrar movimiento</button></div><div class="wrap"><table><tr><th>Fecha</th><th>Unidad</th><th>Conductor</th><th>Origen → Destino</th><th>Medidor ini → fin</th><th>Motivo</th><th>Origen dato</th></tr>
  ${D.movimientos.map(m=>`<tr><td>${fmtF(m.fecha)}</td><td>${esc(nm(U(m.unidad_id)))}</td><td>${esc(m.conductor)}</td><td>${esc(m.origen)} → ${esc(m.destino)}</td><td>${esc(m.medidor_ini)} → ${esc(m.medidor_fin)}</td><td>${esc(m.motivo)}</td><td>${esc(m.fuente)}</td></tr>`).join('')}</table></div>`}

function ale(){
  const l=D.unidades.filter(u=>u.activo!=='NO'&&u.nivel_service!=='OK').sort((a,b)=>a.falta-b.falta);
  return `<h2>Alertas de service</h2><div class="wrap"><table><tr><th>Unidad</th><th>Nivel</th><th>Desde último service</th><th>Falta</th></tr>
  ${l.map(u=>{const un=u.tipo==='MOVIL'?'km':'hs';return `<tr><td>${esc(nm(u))}</td><td><span class="tag ${u.nivel_service}">${u.nivel_service}</span></td><td>${u.recorrido_desde_service} ${un}</td><td>${u.falta} ${un} → gestionar turno</td></tr>`}).join('')||'<tr><td colspan=4>Sin alertas</td></tr>'}</table></div>`}


function ano(){
  return `<h2>Inconsistencias de kilometraje / horas</h2><p style="color:var(--mut);font-size:13px">Se marca cuando el inicio o el cierre difiere más de ${D.cfg.umbral_km_discrepancia||300} km (móviles) o ${D.cfg.umbral_hs_discrepancia||24} hs (embarcaciones) del cierre del evento anterior de la misma unidad.</p>
  <div class="wrap"><table><tr><th>Fecha</th><th>Unidad</th><th>Conductor</th><th>Detalle</th></tr>
  ${D.anomalias.map(a=>`<tr><td>${fmtF(a.fecha)}</td><td>${esc(nm(U(a.unidad_id)))}</td><td>${esc(a.conductor)}</td><td>${a.motivos.map(esc).join('<br>')}</td></tr>`).join('')||'<tr><td colspan=4>Sin inconsistencias ✅</td></tr>'}</table></div>`}

function formService(uid){const u=U(uid),m=u.tipo==='MOVIL';
  abrir('Cargar último service — '+esc(u.identificador),
  `<input type="hidden" name="unidad_id" value="${uid}"><input type="hidden" name="tipo" value="PREVENTIVO"><input type="hidden" name="categoria" value="SERVICE PERIODICO"><input type="hidden" name="estado" value="COMPLETADO">`+
  campo('fecha','Fecha del service',new Date().toISOString().slice(0,10),'date')+campo('medidor',m?'Km al momento del service':'Horas de motor al momento del service','','number')+
  campo('descripcion','Qué se hizo (aceite, filtros, etc.)','','area')+`<div class="row2">${campo('tecnico','Lubricentro / taller')}${campo('costo','Costo','','number')}</div>`,
  o=>guardar('apiGuardarMantenimiento',o))}

function verFicha(uid){
  const u=U(uid),m=u.tipo==='MOVIL',un=m?'km':'hs';
  const mv=D.movimientos.filter(x=>x.unidad_id===uid).slice(0,30),mt=D.mantenimientos.filter(x=>x.unidad_id===uid),fl=D.fallas.filter(x=>x.unidad_id===uid),ad=D.adjuntos.filter(x=>x.unidad_id===uid),an=D.anomalias.filter(x=>x.unidad_id===uid);
  const tabla=(h,f)=>f.length?`<div class="wrap"><table><tr>${h.map(x=>'<th>'+x+'</th>').join('')}</tr>${f.join('')}</table></div>`:'<p style="color:var(--mut)">Sin registros.</p>';
  const html=`<h2 style="margin-top:0">${esc(u.identificador)} <span class="tag ${u.nivel_service}">${u.nivel_service}</span></h2>
  <p>${esc(u.marca_modelo)} ${esc(u.anio)} · 🏠 Base: <b>${esc(u.base||'sin asignar')}</b> · 📍 ${esc(u.asignado_a||'sin asignar')} · ${esc(u.condicion)}</p>
  <p>Medidor: <b>${u.medidor_actual||0} ${un}</b> · Último service: <b>${u.medidor_ultimo_service||0} ${un}</b> · Próximo en <b>${u.falta} ${un}</b> (intervalo ${u.intervalo_efectivo})</p>
  <div class="tools"><button class="b" type="button" onclick="formService('${uid}')">Cargar service</button><button class="b s" type="button" onclick="fichaUnidad('${uid}')">Editar datos</button><button class="b s" type="button" onclick="adjuntar('${uid}')">📎 Adjuntar foto/PDF</button><button class="b s" type="button" onclick="formFalla()">Registrar falla</button></div>
  ${an.length?`<h3 style="color:var(--er)">⚠ Inconsistencias (${an.length})</h3>`+tabla(['Fecha','Detalle'],an.map(a=>`<tr><td>${fmtF(a.fecha)}</td><td>${a.motivos.map(esc).join('<br>')}</td></tr>`)):''}
  <h3>Historial de mantenimientos</h3>${tabla(['Fecha','Tipo','Categoría','Medidor','Detalle','Técnico','Estado'],mt.map(x=>`<tr><td>${fmtF(x.fecha)}</td><td>${esc(x.tipo)}</td><td>${esc(x.categoria)}</td><td>${esc(x.medidor)}</td><td>${esc(x.descripcion)}</td><td>${esc(x.tecnico)}</td><td>${esc(x.estado)}</td></tr>`))}
  <h3>Fallas y reparaciones</h3>${tabla(['Fecha','Prioridad','Falla','Estado','Reparación'],fl.map(x=>`<tr><td>${fmtF(x.fecha)}</td><td>${esc(x.prioridad)}</td><td>${esc(x.descripcion)}</td><td>${esc(x.estado)}</td><td>${esc(x.reparacion_realizada)}</td></tr>`))}
  <h3>Últimos movimientos</h3>${tabla(['Fecha','Conductor','Origen → Destino','Medidor'],mv.map(x=>`<tr><td>${fmtF(x.fecha)}</td><td>${esc(x.conductor)}</td><td>${esc(x.origen)} → ${esc(x.destino)}</td><td>${esc(x.medidor_ini)} → ${esc(x.medidor_fin)}</td></tr>`))}
  <h3>Archivos adjuntos</h3>${ad.map(a=>`<p>📎 <a href="${esc(a.url)}" target="_blank">${esc(a.nombre)}</a> <small>${fmtF(a.fecha)}</small></p>`).join('')||'<p style="color:var(--mut)">Sin archivos.</p>'}`;
  $('#frm').innerHTML=html+'<div class="tools"><button class="b s" value="cancel">Cerrar</button></div>';$('#dlg').style.maxWidth='900px';$('#dlg').showModal();$('#frm').onsubmit=()=>{$('#dlg').style.maxWidth=''};
}


/* ---- Móviles en base / de recorrida ---- */
const HORAS_SALIDA=48; /* una salida sin cierre se considera activa solo si tiene menos de estas horas */
function salidaActiva(uid){
  const l=D.movimientos.filter(m=>m.unidad_id===uid).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const m=l[0];
  if(!m||(m.medidor_fin!==''&&m.medidor_fin!=null))return null;
  if(Date.now()-new Date(m.fecha).getTime()>HORAS_SALIDA*36e5)return null;
  return m}
function fmtFH(s){return s?new Date(s).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}
function bas(){
  const us=D.unidades.filter(u=>u.tipo==='MOVIL'&&u.activo!=='NO');
  const fuera=[],base=[];
  us.forEach(u=>{const s=salidaActiva(u.id);(s?fuera:base).push({u,s})});
  const porBase={};base.forEach(x=>{const b=(x.u.base||'').trim()||'Sin base asignada';(porBase[b]=porBase[b]||[]).push(x.u)});
  const bases=Object.keys(porBase).sort((a,b)=>a==='Sin base asignada'?1:b==='Sin base asignada'?-1:a.localeCompare(b));
  const fila=u=>`<tr><td><b>${esc(u.identificador)}</b> ${esc(u.marca_modelo)}</td><td><span class="tag ${u.condicion==='FUERA DE SERVICIO'?'FUERA':u.condicion==='CON OBSERVACIONES'?'OBS':'OK'}">${esc(u.condicion||'OPERATIVO')}</span></td><td>${esc(u.asignado_a||'')}</td><td>${u.medidor_actual||0} km</td><td><button class="b" onclick="formSalida('${u.id}')">Registrar salida</button> <button class="b s" onclick="verFicha('${u.id}')">Ficha</button></td></tr>`;
  return `<div class="kpis"><div class="kpi"><b style="color:var(--ok)">${base.length}</b><span>En base</span></div><div class="kpi"><b style="color:var(--wa)">${fuera.length}</b><span>De recorrida</span></div><div class="kpi"><b>${us.length}</b><span>Móviles activos</span></div></div>
  <p style="color:var(--mut);font-size:13px">Un móvil está <b>de recorrida</b> si su último movimiento tiene salida registrada y no tiene km de regreso (hasta ${HORAS_SALIDA} hs). Si no, se considera <b>en su base</b>.</p>
  <h2>De recorrida (${fuera.length})</h2>
  <div class="wrap"><table><tr><th>Móvil</th><th>Conductor</th><th>Destino</th><th>Motivo</th><th>Salió</th><th>Km salida</th><th></th></tr>
  ${fuera.map(x=>`<tr><td><b>${esc(x.u.identificador)}</b> ${esc(x.u.marca_modelo)}<br><small>Base: ${esc(x.u.base||'sin asignar')}</small></td><td>${esc(x.s.conductor)}</td><td>${esc(x.s.destino||x.s.origen)}</td><td>${esc(x.s.motivo)}</td><td>${fmtFH(x.s.fecha)}</td><td>${esc(x.s.medidor_ini)}</td><td><button class="b" onclick="formRegreso('${x.s.id}','${x.u.id}')">Registrar regreso</button></td></tr>`).join('')||'<tr><td colspan=7>Ningún móvil de recorrida ✅</td></tr>'}</table></div>
  <h2>En base (${base.length})</h2>
  ${bases.map(b=>`<h3 style="margin:14px 0 6px">🏠 ${esc(b)} <small style="color:var(--mut)">(${porBase[b].length})</small></h3><div class="wrap"><table><tr><th>Móvil</th><th>Condición</th><th>Asignado a</th><th>Medidor</th><th></th></tr>${porBase[b].map(fila).join('')}</table></div>`).join('')||'<p>Sin móviles.</p>'}`}

function formSalida(uid){
  abrir('Registrar salida — '+esc(U(uid).identificador),
  `<input type="hidden" name="unidad_id" value="${uid}">`+campo('conductor','Conductor')+`<div class="row2">${campo('origen','Origen',U(uid).base||'')}${campo('destino','Destino')}</div>`+campo('medidor_ini','Km de salida',U(uid).medidor_actual||'','number')+campo('motivo','Motivo'),
  o=>guardar('apiGuardarMovimiento',o))}
function formRegreso(mid,uid){
  const m=D.movimientos.find(x=>x.id===mid)||{};
  abrir('Registrar regreso — '+esc(U(uid).identificador),
  `<input type="hidden" name="id" value="${mid}">`+campo('medidor_fin','Km de regreso',m.medidor_ini||'','number'),
  o=>guardar('apiCerrarMovimiento',o))}

/* ---- Formularios ---- */
function campo(n,l,v,t,op){v=v==null?'':v;let i;
  if(op)i=`<select name="${n}">${op.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(t==='area')i=`<textarea name="${n}" rows="3">${esc(v)}</textarea>`;
  else i=`<input name="${n}" type="${t||'text'}" value="${esc(v)}">`;
  return `<div class="f"><label>${l}</label>${i}</div>`}
function selUnidad(v,t){return campo('unidad_id','Unidad',v,null,null).replace(/<input[^>]*>/,`<select name="unidad_id">${D.unidades.filter(u=>!t||u.tipo===t).map(u=>`<option value="${u.id}" ${u.id===v?'selected':''}>${esc(nm(u))}</option>`).join('')}</select>`)}
function abrir(titulo,html,onOk){
  $('#frm').innerHTML=`<h3>${titulo}</h3>${html}<div class="tools"><button class="b" value="ok">Guardar</button><button class="b s" value="cancel" formnovalidate>Cancelar</button></div>`;
  const d=$('#dlg');d.showModal();
  $('#frm').onsubmit=e=>{const ok=e.submitter&&e.submitter.value==='ok';if(ok){const o={};new FormData($('#frm')).forEach((v,k)=>o[k]=v);onOk(o)}};
}
function guardar(fn,o){google.script.run.withSuccessHandler(()=>cargar()).withFailureHandler(e=>alert(e.message))[fn](o)}

function fichaUnidad(id,base){
  const u=id?U(id):Object.assign({tipo:'MOVIL',condicion:'OPERATIVO'},base),m=u.tipo==='MOVIL';
  abrir(id?'Editar unidad':'Nueva unidad',
  `<input type="hidden" name="tipo" value="${u.tipo}">`+campo('identificador',m?'Patente':'Matrícula / nombre',u.identificador)+campo('marca_modelo','Marca / modelo',u.marca_modelo)+campo('anio','Año',u.anio)+
  campo('base','Base (dónde está el móvil cuando no sale)',u.base)+campo('asignado_a','Asignado a (intendencia, seccional, guardaparque…)',u.asignado_a)+campo('condicion','Condición',u.condicion,null,['OPERATIVO','CON OBSERVACIONES','FUERA DE SERVICIO'])+
  `<div class="row2">`+campo('medidor_actual',m?'Km actuales':'Horas motor actuales',u.medidor_actual,'number')+campo('medidor_ultimo_service',m?'Km del último service':'Horas del último service',u.medidor_ultimo_service,'number')+`</div>`+
  `<div class="row2">`+campo('intervalo_service','Intervalo de service ('+(m?'km':'hs')+') — vacío = general',u.intervalo_service,'number')+campo('margen_alerta','Alertar cuando falten (vacío = general)',u.margen_alerta,'number')+`</div>`+
  campo('er_nombre','Nombre en EarthRanger (si difiere)',u.er_nombre)+campo('notas','Notas',u.notas,'area'),
  o=>{if(id)o.id=id;guardar('apiGuardarUnidad',o)})}
function formMov(){abrir('Movimiento',selUnidad('')+campo('conductor','Conductor')+`<div class="row2">${campo('origen','Origen')}${campo('destino','Destino')}</div><div class="row2">${campo('medidor_ini','Medidor inicial','','number')}${campo('medidor_fin','Medidor final','','number')}</div>`+campo('motivo','Motivo'),o=>guardar('apiGuardarMovimiento',o))}
function formMant(){abrir('Mantenimiento / service',selUnidad('')+`<div class="row2">${campo('tipo','Tipo','','',['PREVENTIVO','CORRECTIVO','REVISION','MODIFICACION'])}${campo('categoria','Categoría','','',['SERVICE PERIODICO','MECANICA','MOTOR','CHAPA Y PINTURA','NEUMATICOS','COMUNICACIONES','SEGURIDAD','RTO'])}</div>`+
  `<div class="row2">${campo('medidor','Km / hs al momento','','number')}${campo('estado','Estado','','',['EN ESPERA','EN PROGRESO','COMPLETADO'])}</div>`+campo('descripcion','Trabajo realizado','','area')+`<div class="row2">${campo('tecnico','Técnico / taller')}${campo('costo','Costo','','number')}</div>`+campo('repuestos','Repuestos'),o=>guardar('apiGuardarMantenimiento',o))}
function formFalla(id){const f=id?D.fallas.find(x=>x.id===id):{};abrir('Falla / reparación',selUnidad(f.unidad_id)+campo('descripcion','Falla',f.descripcion,'area')+`<div class="row2">${campo('prioridad','Prioridad',f.prioridad||'MEDIA','',['CRITICA','ALTA','MEDIA','BAJA'])}${campo('estado','Estado',f.estado||'ABIERTA','',['ABIERTA','EN REPARACION','RESUELTA'])}</div>`+campo('reparacion_realizada','Reparación realizada',f.reparacion_realizada,'area'),o=>{if(id)o.id=id;guardar('apiGuardarFalla',o)})}

/* ---- Adjuntos ---- */
function adjuntar(uid){
  const i=document.createElement('input');i.type='file';i.multiple=true;i.accept='image/*,application/pdf';
  i.onchange=async()=>{for(const f of i.files){if(f.size>25*1024*1024){alert(f.name+' supera 25 MB');continue}
    const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f)});
    await new Promise(r=>google.script.run.withSuccessHandler(r).withFailureHandler(e=>{alert(e.message);r()}).apiSubirAdjunto(uid,'UNIDAD','',f.name,f.type||'application/octet-stream',b64))}
    cargar();alert('Archivos subidos')};i.click()}
function verAdj(uid){const l=D.adjuntos.filter(a=>a.unidad_id===uid);
  abrir('Archivos de '+nm(U(uid)),l.map(a=>`<p>📎 <a href="${esc(a.url)}" target="_blank">${esc(a.nombre)}</a> <small>${fmtF(a.fecha)}</small></p>`).join('')||'<p>Sin archivos.</p>',()=>{})}

cargar();setInterval(cargar,300000);
</script>
